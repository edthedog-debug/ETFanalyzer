<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIMA-GARCH Real-Time Fund Forecast</title>
    <!-- Chart.js for visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .fund-info h1 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .fund-meta {
            display: flex;
            gap: 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .fund-meta span {
            background: #0f172a;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .prediction-badge {
            padding: 16px 24px;
            border-radius: 8px;
            text-align: center;
            min-width: 180px;
        }

        .prediction-badge.bullish {
            background-color: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--accent-green);
        }

        .prediction-badge.bearish {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--accent-red);
        }

        .prediction-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .prediction-value {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .bullish .prediction-value { color: var(--accent-green); }
        .bearish .prediction-value { color: var(--accent-red); }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .table-container {
            max-height: 400px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            position: sticky;
            top: 0;
            background-color: var(--card-bg);
            color: var(--text-muted);
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .status-tag {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .status-historical { background: #334155; color: #cbd5e1; }
        .status-forecast { background: #1e3a8a; color: #93c5fd; }
    </style>
</head>
<body>

<div class="container">
    <!-- Fund Metadata & 30-Day Directional Indicator -->
    <div class="header-card">
        <div class="fund-info">
            <h1>Amundi MSCI Europe Growth UCITS ETF Acc</h1>
            <div class="fund-meta">
                <span><strong>ISIN:</strong> LU1681042435</span>
                <span><strong>Ticker:</strong> CG9</span>
                <span><strong>Currency:</strong> EUR</span>
                <span><strong>TER:</strong> 0.35%</span>
            </div>
        </div>
        <div id="predictionBadge" class="prediction-badge bullish">
            <div class="prediction-title">30-Day Forecast</div>
            <div class="prediction-value" id="predictionText">UP (+2.15%)</div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div class="dashboard-grid">
        <!-- Real-Time Dynamic Chart -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">ARIMA-GARCH Real-Time Price Simulation</h2>
                <div class="controls">
                    <button id="toggleSimBtn">Pause Stream</button>
                    <button id="resetBtn">Reset</button>
                </div>
            </div>
            <canvas id="priceChart" height="280"></canvas>
        </div>

        <!-- Historical & Projected Closing Prices Table -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Closing Prices History</h2>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date / Step</th>
                            <th>Close Price</th>
                            <th>Type</th>
                        </tr>
                    </thead>
                    <tbody id="priceTableBody">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Model Configuration & State ---
    const initialPrice = 310.25; // Base price for LU1681042435 in EUR
    const arimaDrift = 0.0007;   // ARIMA daily expected log return (positive trend)
    const ar1Param = 0.25;       // AR(1) autocorrelation factor
    const omega = 0.00001;       // GARCH baseline variance
    const alpha = 0.08;          // GARCH shock sensitivity
    const beta = 0.88;           // GARCH variance persistence

    let currentPrice = initialPrice;
    let lastReturn = 0;
    let lastVariance = 0.00015;  // Initial volatility state
    let isRunning = true;
    let intervalId = null;

    const historicalData = [];
    const forecastHorizon = 30;

    // Seed historical dataset (30 days back)
    const now = new Date();
    for (let i = 30; i >= 1; i--) {
        const date = new Date(now);
        date.setDate(date.getDate() - i);
        
        // Simulating historic prices
        const shock = (Math.random() - 0.5) * 0.015;
        const ret = arimaDrift + shock;
        const simPrice = i === 30 ? initialPrice : historicalData[historicalData.length - 1].price * Math.exp(ret);
        
        historicalData.push({
            label: date.toISOString().split('T')[0],
            price: parseFloat(simPrice.toFixed(2)),
            type: 'Historical'
        });
    }

    // --- Chart Setup ---
    const ctx = document.getElementById('priceChart').getContext('2d');
    const priceChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: historicalData.map(d => d.label),
            datasets: [
                {
                    label: 'Historical Close Price (€)',
                    data: historicalData.map(d => d.price),
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    tension: 0.1
                },
                {
                    label: 'ARIMA-GARCH Live Stream (€)',
                    data: Array(historicalData.length - 1).fill(null).concat([historicalData[historicalData.length - 1].price]),
                    borderColor: '#22c55e',
                    borderDash: [5, 5],
                    fill: false,
                    tension: 0.1
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    grid: { color: '#334155' },
                    ticks: { color: '#94a3b8' }
                },
                y: {
                    grid: { color: '#334155' },
                    ticks: { color: '#94a3b8' }
                }
            },
            plugins: {
                legend: { labels: { color: '#f8fafc' } }
            }
        }
    });

    // --- Dynamic Table Population ---
    function renderTable() {
        const tbody = document.getElementById('priceTableBody');
        tbody.innerHTML = '';
        
        // Render in reverse chronological order
        const fullList = [...historicalData].reverse();
        fullList.forEach(row => {
            const tr = document.createElement('tr');
            const isForecast = row.type === 'Forecast';
            
            tr.innerHTML = `
                <td>${row.label}</td>
                <td><strong>€${row.price.toFixed(2)}</strong></td>
                <td>
                    <span class="status-tag ${isForecast ? 'status-forecast' : 'status-historical'}">
                        ${row.type}
                    </span>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- ARIMA-GARCH Step Generation ---
    function generateNextPriceStep() {
        // GARCH(1,1) Volatility Calculation
        const newVariance = omega + alpha * Math.pow(lastReturn, 2) + beta * lastVariance;
        const currentVolatility = Math.sqrt(newVariance);
        
        // Standard normal random noise
        const u1 = Math.random();
        const u2 = Math.random();
        const z = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);

        // ARIMA(1,0,0) Mean Return Calculation
        const currentReturn = arimaDrift + ar1Param * lastReturn + z * currentVolatility;
        
        // Update state
        lastReturn = currentReturn;
        lastVariance = newVariance;
        
        const lastPrice = priceChart.data.datasets[1].data.slice(-1)[0] || historicalData[historicalData.length - 1].price;
        const newPrice = lastPrice * Math.exp(currentReturn);

        // Date label for step
        const lastLabel = priceChart.data.labels[priceChart.data.labels.length - 1];
        const nextDate = new Date(lastLabel);
        nextDate.setDate(nextDate.getDate() + 1);
        const dateStr = nextDate.toISOString().split('T')[0];

        // Push to chart
        priceChart.data.labels.push(dateStr);
        priceChart.data.datasets[0].data.push(null); // Keep historical aligned
        priceChart.data.datasets[1].data.push(parseFloat(newPrice.toFixed(2)));
        priceChart.update();

        // Push to historical data array for table rendering
        historicalData.push({
            label: dateStr,
            price: parseFloat(newPrice.toFixed(2)),
            type: 'Forecast'
        });
        
        renderTable();
        updateDirectionalIndicator();
    }

    // --- Directional Indicator Calculation ---
    function updateDirectionalIndicator() {
        const startPrice = historicalData[0].price;
        const latestPrice = historicalData[historicalData.length - 1].price;
        const pctChange = ((latestPrice - startPrice) / startPrice) * 100;
        
        const badge = document.getElementById('predictionBadge');
        const text = document.getElementById('predictionText');

        if (pctChange >= 0) {
            badge.className = 'prediction-badge bullish';
            text.textContent = `UP (+${pctChange.toFixed(2)}%)`;
        } else {
            badge.className = 'prediction-badge bearish';
            text.textContent = `DOWN (${pctChange.toFixed(2)}%)`;
        }
    }

    // --- Real-Time Execution Control ---
    function startStream() {
        intervalId = setInterval(generateNextPriceStep, 1500); // New tick every 1.5s
    }

    document.getElementById('toggleSimBtn').addEventListener('click', (e) => {
        if (isRunning) {
            clearInterval(intervalId);
            e.target.textContent = 'Resume Stream';
        } else {
            startStream();
            e.target.textContent = 'Pause Stream';
        }
        isRunning = !isRunning;
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        location.reload();
    });

    // Initialize
    renderTable();
    startStream();
</script>
</body>
</html>
