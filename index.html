<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF Forecasting Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Cabecera y Controles */
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
            margin-left: 10px;
            cursor: pointer;
        }

        /* Tarjetas de Información */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .card h3 { margin: 0 0 5px 0; font-size: 14px; color: var(--text-muted); }
        .card p { margin: 0; font-size: 24px; font-weight: bold; }
        
        #statusMessage {
            font-size: 12px;
            color: #fbbf24;
            margin-top: 10px;
        }

        /* Gráficas */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            height: 350px;
            position: relative;
        }

        .chart-container h4 {
            margin-top: 0;
            text-align: center;
            color: var(--text-muted);
        }

        /* Tabla de Datos */
        .table-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th { color: var(--text-muted); font-weight: normal; }

        .status-tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .tag-historical { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .tag-forecast { background-color: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .tag-up { background-color: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .tag-down { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; }

        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .header-controls { flex-direction: column; gap: 15px; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="container">
    <div
